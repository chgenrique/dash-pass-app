<div class="text">
    <h4>{{ label }}</h4>

    <span class="total">{{ total }}</span>
    <span>
        <mat-icon color="primary" role="img">trending_up</mat-icon>
    </span>

    <span class="description">{{ percentage }}%</span>
    <span> of target</span>
</div>
<div class="widget">
    <div style="width: 100%; height: 60px; display: block;" [chart]="chart"></div>
</div>
