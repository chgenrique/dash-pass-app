<div class="container" novalidate>
    <form [formGroup]="formAccount" (ngSubmit)="onSubmit(formAccount.value)" class="form">

        <mat-card-title>
            Create Account Entry
        </mat-card-title>

        <mat-card-content>
            <mat-card>
                <div class="form-element-container">
                    <mat-form-field class="full-width">
                        <mat-label>Title</mat-label>
                        <input matInput placeholder="Title" formControlName="title">
                    </mat-form-field>
                </div>
                <div class="form-element-container">
                    <mat-form-field class="full-width">
                        <mat-label>UserName</mat-label>
                        <input matInput placeholder="UserName" formControlName="userName" class="form-control">
                    </mat-form-field>

                    <mat-form-field class="full-width">
                        <mat-label>Account Password</mat-label>
                        <input matInput placeholder="Account Password" formControlName="accountPassword"
                            class="form-control">
                        <mat-error *ngIf="formAccount.controls['accountPassword'].hasError('required')">Account Password
                            is
                            <strong>required</strong></mat-error>
                    </mat-form-field>
                    
                </div>
                <div class="form-element-container">
                   
                </div>
                <div class="form-element-container">
                    <mat-form-field class="full-width">
                        <mat-label>Email</mat-label>
                        <input type="email" matInput formControlName="email" class="form-control">

                        <mat-error
                            *ngIf="formAccount.controls['email'].hasError('email') && !formAccount.controls['email'].hasError('required')">Please
                            enter a valid email address</mat-error>

                        <mat-error *ngIf="formAccount.controls['email'].hasError('required')">Email is
                            <strong>required</strong></mat-error>

                    </mat-form-field>
                </div>
                <div class="form-element-container">
                    <mat-form-field class="full-width" [hideRequiredMarker]="true" appearance="fill">
                        <mat-label>Spec URL</mat-label>
                        <input matInput placeholder="Enter URL" formControlName="url" class="form-control">
                        <mat-error *ngIf="formAccount.controls['url'].hasError('required')"></mat-error>
                    </mat-form-field>
                </div>
            </mat-card>
        </mat-card-content>

        <div class="form-buttons">
            <button mat-raised-button class="button" color="secondary" type="button" (click)="clear()">Clear</button>
            <button mat-raised-button color="primary" type="submit" class="button"
                [disabled]="!formAccount.valid">Submit Form</button>
        </div>

    </form>
</div>
